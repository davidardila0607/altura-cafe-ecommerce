<!--
  En escritorio (con movimiento) la sección se "ancla": queda fija en pantalla mientras el
  scroll vertical mueve la pista de fotos hacia la izquierda. En móvil o con movimiento
  reducido es una fila que se desliza con el dedo (scroll horizontal con imán).
-->
<section #seccion id="proceso" class="proceso" tabindex="-1" aria-labelledby="proceso-titulo">
  <div class="pegajoso">
    <ol #pista class="pista" tabindex="0" aria-label="Pasos del proceso, de la montaña a la taza">
      <li class="intro">
        <h2 id="proceso-titulo" class="titulo-seccion">De la montaña a tu taza</h2>
        <p class="bajada">Cuatro momentos separan una ladera colombiana de tu cocina. En cada uno se decide algo de lo que vas a sentir en la taza.</p>
      </li>
      @for (paso of pasos; track paso.titulo) {
        <li class="paso">
          <figure class="foto">
            <img
              [src]="paso.src"
              [attr.srcset]="paso.srcset"
              sizes="(min-width: 900px) 34vw, 78vw"
              [alt]="paso.foto.alt"
              width="1200"
              height="1500"
              loading="lazy"
              decoding="async"
            />
          </figure>
          <h3 class="nombre-paso">{{ paso.titulo }}</h3>
          <p class="texto-paso">{{ paso.texto }}</p>
        </li>
      }
    </ol>
  </div>
</section>
