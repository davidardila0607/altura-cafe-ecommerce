<section class="guia" aria-labelledby="guia-procesos-titulo">
  <h3 id="guia-procesos-titulo" class="titulo">Tres procesos, tres tazas</h3>
  <p class="bajada">El mismo grano cambia según cómo se trata la cereza después de la cosecha.</p>

  <ul class="lista">
    @for (p of procesos(); track p.id) {
      <li class="proceso" [style.--color-proceso]="marca(p.nombre).color">
        <p class="nombre">
          <i [class]="'bi ' + marca(p.nombre).icono" aria-hidden="true"></i>
          {{ p.nombre }}
        </p>
        <p class="texto">{{ marca(p.nombre).texto || p.descripcion }}</p>
        @if (marca(p.nombre).enTaza) {
          <p class="en-taza">{{ marca(p.nombre).enTaza }}</p>
        }
        <button type="button" class="enlace-texto" (click)="elegir.emit(normalizar(p.nombre))">
          Ver {{ cantidad(p.nombre) }}<span class="visually-hidden"> {{ p.nombre }}</span>
        </button>
      </li>
    }
  </ul>
</section>
