<div class="filtros">
  @if (conBuscador()) {
    <div class="grupo">
      <label class="titulo-grupo" [for]="prefijo() + '-buscar'">Buscar</label>
      <div class="buscador">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input
          [id]="prefijo() + '-buscar'"
          type="search"
          class="campo"
          placeholder="Nombre, origen o proceso"
          autocomplete="off"
          [value]="filtros().q"
          (input)="buscar($event)"
        />
      </div>
    </div>
  }

  <!--
    Variedad, Proceso y Origen son listas verticales: una fila por opción con su marca
    (muestra de color o ícono), el nombre y el número de cafés alineado a la derecha.
  -->
  <fieldset class="grupo">
    <legend class="titulo-grupo">Variedad</legend>
    <div class="lista" [id]="prefijo() + '-variedades'">
      <button type="button" class="opcion" [attr.aria-pressed]="filtros().variedad === null" (click)="cambiar.emit({ variedad: null })">
        <span class="marca" aria-hidden="true"></span>
        <span class="nombre-opcion">Todas</span>
        <span class="cantidad">{{ total() }}<span class="visually-hidden"> cafés</span></span>
      </button>
      @for (v of variedadesVisibles(); track v.id; let i = $index) {
        <button
          type="button"
          class="opcion"
          [style.--i]="i"
          [style.--color-opcion]="colorVariedad(v.nombre)"
          [attr.aria-pressed]="filtros().variedad === normalizar(v.nombre)"
          (click)="cambiar.emit({ variedad: normalizar(v.nombre) })"
        >
          <span class="marca" aria-hidden="true"><span class="muestra"></span></span>
          <span class="nombre-opcion">{{ v.nombre }}</span>
          <span class="cantidad">{{ conteo(conteoVariedades(), v.nombre) }}<span class="visually-hidden"> cafés</span></span>
        </button>
      }
    </div>
    @if (hayOcultas()) {
      <button
        type="button"
        class="ver-mas"
        [attr.aria-expanded]="verTodas()"
        [attr.aria-controls]="prefijo() + '-variedades'"
        (click)="verTodas.set(!verTodas())"
      >
        {{ verTodas() ? 'Ver menos variedades' : 'Ver las ' + variedades().length + ' variedades' }}
        <i class="bi bi-chevron-down" [class.girado]="verTodas()" aria-hidden="true"></i>
      </button>
    }
  </fieldset>

  <fieldset class="grupo">
    <legend class="titulo-grupo">Proceso</legend>
    <div class="lista">
      <button type="button" class="opcion" [attr.aria-pressed]="filtros().proceso === null" (click)="cambiar.emit({ proceso: null })">
        <span class="marca" aria-hidden="true"></span>
        <span class="nombre-opcion">Todos</span>
        <span class="cantidad">{{ total() }}<span class="visually-hidden"> cafés</span></span>
      </button>
      @for (p of procesos(); track p.id) {
        <button
          type="button"
          class="opcion"
          [style.--color-opcion]="marcaProceso(p.nombre).color"
          [attr.aria-pressed]="filtros().proceso === normalizar(p.nombre)"
          (click)="cambiar.emit({ proceso: normalizar(p.nombre) })"
        >
          <span class="marca" aria-hidden="true"><i [class]="'bi ' + marcaProceso(p.nombre).icono"></i></span>
          <span class="nombre-opcion">{{ p.nombre }}</span>
          <span class="cantidad">{{ conteo(conteoProcesos(), p.nombre) }}<span class="visually-hidden"> cafés</span></span>
        </button>
      }
    </div>
  </fieldset>

  <!-- Presentación: tres botones del mismo ancho. -->
  <fieldset class="grupo">
    <legend class="titulo-grupo">Presentación</legend>
    <div class="segmentos">
      <button type="button" class="segmento" [attr.aria-pressed]="filtros().presentacion === null" (click)="cambiar.emit({ presentacion: null })">
        Todas
      </button>
      @for (p of presentaciones(); track p.value) {
        <button
          type="button"
          class="segmento"
          [attr.aria-pressed]="filtros().presentacion === p.value"
          (click)="cambiar.emit({ presentacion: p.value })"
        >
          {{ p.label }}
        </button>
      }
    </div>
  </fieldset>

  <fieldset class="grupo">
    <legend class="titulo-grupo">Origen</legend>
    <div class="lista">
      <button type="button" class="opcion" [attr.aria-pressed]="filtros().origen === null" (click)="cambiar.emit({ origen: null })">
        <span class="marca" aria-hidden="true"></span>
        <span class="nombre-opcion">Todos</span>
        <span class="cantidad">{{ total() }}<span class="visually-hidden"> cafés</span></span>
      </button>
      @for (o of origenes(); track o.clave) {
        <button
          type="button"
          class="opcion"
          [attr.aria-pressed]="filtros().origen === o.clave"
          (click)="cambiar.emit({ origen: o.clave })"
        >
          <span class="marca" aria-hidden="true"><i class="bi bi-geo-alt"></i></span>
          <span class="nombre-opcion">{{ o.nombre }}</span>
          <span class="cantidad">{{ conteoOrigenes()[o.clave] ?? 0 }}<span class="visually-hidden"> cafés</span></span>
        </button>
      }
    </div>
  </fieldset>

  <div class="grupo">
    <label class="interruptor" [for]="prefijo() + '-disponibles'">
      <input
        type="checkbox"
        role="switch"
        [id]="prefijo() + '-disponibles'"
        [checked]="filtros().disponibles"
        (change)="alternarDisponibles($event)"
      />
      Solo disponibles
    </label>
  </div>

  <button type="button" class="boton boton-contorno limpiar" [disabled]="activos() === 0 && !filtros().q" (click)="limpiar.emit()">
    Limpiar filtros
    @if (activos() > 0) {
      <span class="contador">{{ activos() }}</span>
    }
  </button>
</div>
