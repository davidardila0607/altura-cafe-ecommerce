<header class="barra">
  <nav class="contenedor fila" aria-label="Navegación principal">
    <a class="marca" routerLink="/" aria-label="Altura, ir al inicio">
      <app-logo />
    </a>

    <div id="menu-principal" class="menu" [class.abierto]="menuAbierto()">
      <ul class="enlaces">
        <li>
          <a
            routerLink="/"
            routerLinkActive="activo"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >Inicio</a
          >
        </li>
        <li>
          <a routerLink="/productos" routerLinkActive="activo" ariaCurrentWhenActive="page">Productos</a>
        </li>
      </ul>

      <form class="buscador" role="search" (submit)="enviar($event, campo)">
        <label for="buscar-cafes" class="visually-hidden">Buscar cafés</label>
        <i class="bi bi-search" aria-hidden="true"></i>
        <input
          #campo
          id="buscar-cafes"
          type="search"
          class="form-control"
          placeholder="Busca por nombre, origen o variedad"
          autocomplete="off"
          enterkeyhint="search"
          [value]="textoBusqueda()"
          (input)="escribir($event)"
        />
      </form>
    </div>

    <div class="acciones">
      <a class="boton-icono" routerLink="/login" aria-label="Iniciar sesión" title="Iniciar sesión">
        <i class="bi bi-person" aria-hidden="true"></i>
      </a>
      <button
        type="button"
        class="boton-icono alternar"
        aria-controls="menu-principal"
        [attr.aria-expanded]="menuAbierto()"
        [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
        (click)="alternarMenu()"
      >
        <i class="bi" [class.bi-list]="!menuAbierto()" [class.bi-x-lg]="menuAbierto()" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</header>
