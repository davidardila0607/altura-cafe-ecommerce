<article class="tarjeta" appInclinar [class.agotada]="disponibilidad().tipo === 'agotado'">
  <div class="imagen">
    @if (imagen(); as url) {
      <img
        [src]="url"
        [attr.srcset]="srcset()"
        [attr.sizes]="sizes()"
        [attr.data-bolsa]="cafe().id"
        [alt]="'Bolsa de café ' + cafe().nombre + ', variedad ' + cafe().variedadNombre + ', proceso ' + cafe().procesoNombre + ', ' + cafe().presentacionGramos + ' g'"
        width="600"
        height="750"
        [attr.loading]="prioridad() ? 'eager' : 'lazy'"
        [attr.fetchpriority]="prioridad() ? 'high' : null"
        decoding="async"
      />
    } @else {
      <i class="bi bi-cup-hot sin-imagen" aria-hidden="true"></i>
    }
  </div>

  <div class="cuerpo">
    <!-- Cada fila ocupa una sola línea: así todas las cards de la grilla quedan alineadas. -->
    <div class="fila">
      <app-etiqueta-cafe tipo="variedad" [nombre]="cafe().variedadNombre" />
      <span class="gramos">{{ cafe().presentacionGramos }} g</span>
    </div>

    <h3 class="nombre" [title]="cafe().nombre">{{ cafe().nombre }}</h3>

    <div class="fila">
      <p class="origen">
        <i class="bi bi-geo-alt" aria-hidden="true"></i>
        <span class="visually-hidden">Origen:</span>
        <span class="recorte">{{ cafe().origen }}</span>
      </p>
      <app-etiqueta-cafe tipo="proceso" [nombre]="cafe().procesoNombre" />
    </div>

    <div class="pie">
      <p class="precio">{{ cafe().precio | currency: 'COP' : 'symbol-narrow' : '1.0-0' : 'es-CO' }}</p>
      <p class="disponibilidad" [attr.data-tipo]="disponibilidad().tipo">{{ disponibilidad().texto }}</p>
    </div>

    <!-- Agregar al carrito: queda por encima de la capa clicable de "Ver producto". -->
    <app-agregar-carrito class="compra" [cafe]="cafe()" variante="compacta" />

    <!-- El botón se extiende sobre toda la card (::after): cualquier clic en ella abre el producto. -->
    <button
      type="button"
      class="ver"
      [attr.aria-label]="'Ver producto ' + cafe().nombre + ' ' + cafe().presentacionGramos + ' g'"
      (click)="ver.emit(cafe())"
    >
      Ver producto
      <i class="bi bi-arrow-up-right" aria-hidden="true"></i>
    </button>
  </div>
</article>
