<svg viewBox="0 0 660 540" focusable="false" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="desvanecer" cx="50%" cy="46%" r="52%">
      <stop offset="0.55" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="mascara-curvas">
      <rect width="660" height="540" fill="url(#desvanecer)" />
    </mask>
    <linearGradient id="volumen-bolsa" x1="0" x2="1">
      <stop offset="0" stop-color="#2B1D14" stop-opacity="0.34" />
      <stop offset="0.15" stop-color="#2B1D14" stop-opacity="0.03" />
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.08" />
      <stop offset="0.86" stop-color="#2B1D14" stop-opacity="0.02" />
      <stop offset="1" stop-color="#2B1D14" stop-opacity="0.4" />
    </linearGradient>
    <filter id="sombra-suelo" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <g class="curvas" mask="url(#mascara-curvas)">
    @for (curva of curvas; track $index) {
      <path [attr.d]="curva" />
    }
  </g>

  @for (bolsa of bolsas; track bolsa.variedad) {
    <ellipse
      class="sombra"
      [attr.cx]="bolsa.x"
      [attr.cy]="bolsa.suelo + 2"
      [attr.rx]="300 * bolsa.escala"
      [attr.ry]="20 * bolsa.escala"
      filter="url(#sombra-suelo)"
    />
    <g [attr.transform]="'translate(' + bolsa.x + ' ' + bolsa.suelo + ') scale(' + bolsa.escala + ')'">
      <path [attr.d]="contorno" [style.fill]="bolsa.color" />
      <path [attr.d]="contorno" fill="url(#volumen-bolsa)" />
      <rect x="-258" y="-760" width="516" height="44" rx="8" class="sello" />
      <circle cx="0" cy="-664" r="21" class="valvula" />
      <circle cx="0" cy="-664" r="10" class="valvula-centro" />

      <rect x="-190" y="-604" width="380" height="430" rx="16" class="etiqueta" />
      <path d="M -27,-530 L -11,-554 L -1,-540 L 12,-561 L 29,-530" class="etiqueta-marca" />
      <text x="0" y="-468" class="etiqueta-nombre">ALTURA</text>
      <line x1="-120" y1="-430" x2="120" y2="-430" class="etiqueta-linea" [style.stroke]="bolsa.color" />
      <text x="0" y="-356" class="etiqueta-variedad">{{ bolsa.variedad }}</text>
      <text x="0" y="-250" class="etiqueta-peso">{{ bolsa.gramos }} g</text>
    </g>
  }
</svg>
