<aside class="panel">
  <img
    class="foto"
    [src]="src"
    [attr.srcset]="srcset"
    sizes="(min-width: 992px) 55vw, 100vw"
    [alt]="foto.alt"
    width="1600"
    height="2000"
    loading="eager"
    fetchpriority="high"
    decoding="async"
  />

  <a routerLink="/" class="enlace-logo" aria-label="Altura, ir al inicio">
    <app-logo tono="claro" />
  </a>

  <div class="mensaje">
    <p class="frase">{{ frase() }}</p>
    <p class="detalle">Lotes de fincas colombianas de altura, tostados en tandas pequeñas.</p>
  </div>
</aside>
