        fill="#2B1D14" opacity="0.26" filter="url(#sombraProyectada)"/>
  <ellipse cx="804.4" cy="1266" rx="399.6" ry="17.76" fill="#2B1D14" opacity="0.42" filter="url(#sombraContacto)"/>

